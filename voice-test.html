<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voice Dictation Test</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #111; color: #fff; }
  h2 { color: #06b6d4; }
  button { padding: 16px 32px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; margin: 10px; }
  #startBtn { background: #06b6d4; color: #000; }
  #stopBtn  { background: #ef4444; color: #fff; }
  #status   { margin: 16px 0; padding: 12px; background: #1e293b; border-radius: 8px; font-size: 14px; min-height: 24px; }
  #output   { margin: 16px 0; padding: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; min-height: 80px; font-size: 16px; line-height: 1.6; }
  .green { color: #22c55e; }
  .red   { color: #ef4444; }
  .yellow{ color: #eab308; }
</style>
</head>
<body>
<h2>🎙️ Voice Dictation Diagnostic Test</h2>
<p>Click <strong>Start Dictation</strong>, allow mic permission, then SPEAK. Words should appear below.</p>

<button id="startBtn" onclick="startDictation()">▶ Start Dictation</button>
<button id="stopBtn"  onclick="stopDictation()" disabled>■ Stop</button>

<div id="status">Status: <span id="statusText" class="yellow">Ready — click Start</span></div>
<div id="output"><em style="color:#475569">Words will appear here as you speak...</em></div>

<hr style="border-color:#334155; margin:20px 0">
<div id="checks"></div>

<script>
  let recognition = null;
  let accumulated  = '';

  function setStatus(msg, cls) {
    const el = document.getElementById('statusText');
    el.textContent = msg;
    el.className = cls || 'yellow';
  }

  function addCheck(label, pass, detail) {
    const el = document.getElementById('checks');
    const div = document.createElement('div');
    div.style.margin = '6px 0';
    div.innerHTML = `<span style="color:${pass?'#22c55e':'#ef4444'}">${pass?'✅':'❌'} ${label}</span>${detail ? ` — <small style="color:#94a3b8">${detail}</small>` : ''}`;
    el.appendChild(div);
  }

  // Browser capability checks
  window.onload = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    addCheck('SpeechRecognition API available', !!SR, SR ? 'API found' : 'USE CHROME/EDGE!');
    addCheck('Running on localhost (required for mic)', location.hostname === 'localhost' || location.protocol === 'https:', location.href);
    addCheck('Browser is Chrome/Edge', /Chrome|Edg/.test(navigator.userAgent), navigator.userAgent.split(' ').slice(-1)[0]);
    
    navigator.permissions?.query({ name: 'microphone' }).then(r => {
      addCheck('Microphone permission', r.state !== 'denied', `State: ${r.state}`);
    }).catch(() => addCheck('Microphone permission', true, 'Cannot query — will prompt on start'));
  };

  function startDictation() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setStatus('❌ SpeechRecognition NOT supported! Use Chrome or Edge.', 'red');
      return;
    }

    accumulated = '';
    document.getElementById('output').textContent = '';

    recognition = new SR();
    recognition.continuous      = true;
    recognition.interimResults  = true;
    recognition.lang            = 'en-US';

    recognition.onstart = () => {
      setStatus('🟢 ACTIVE — speak now!', 'green');
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled  = false;
    };

    recognition.onaudiostart = () => setStatus('🟢 Microphone opened — speak!', 'green');

    recognition.onsoundstart  = () => setStatus('🔊 Sound detected!', 'green');

    recognition.onspeechstart = () => setStatus('🗣️ Speech detected — processing...', 'green');

    recognition.onresult = (event) => {
      let interim = '';
      let finals  = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finals += t + ' ';
        else interim += t;
      }
      if (finals) accumulated += finals;
      document.getElementById('output').textContent = (accumulated + interim).trim() || '(still processing...)';
      setStatus(`✅ Got text! (confidence: ${(event.results[event.results.length-1][0].confidence * 100).toFixed(0)}%)`, 'green');
    };

    recognition.onerror = (err) => {
      const msgs = {
        'not-allowed':   '❌ Mic BLOCKED! Click padlock → allow microphone, refresh page.',
        'no-speech':     '⏳ No speech detected yet. Keep talking!',
        'audio-capture': '❌ No microphone found! Check your mic is connected.',
        'network':       '⚠️ Network error — Chrome needs internet for Speech API.',
        'service-not-allowed': '❌ Service not allowed on this page.',
        'aborted':       '⚠️ Recognition aborted.',
      };
      setStatus(msgs[err.error] || `Error: ${err.error}`, err.error === 'no-speech' ? 'yellow' : 'red');
      console.error('Speech error:', err.error, err);
    };

    recognition.onend = () => {
      if (document.getElementById('stopBtn').disabled === false) {
        // Still supposed to be running — restart
        try { recognition.start(); } catch(e) {}
      }
    };

    try {
      recognition.start();
      setStatus('⏳ Requesting mic permission...', 'yellow');
    } catch(e) {
      setStatus('❌ Failed to start: ' + e.message, 'red');
    }
  }

  function stopDictation() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
      recognition = null;
    }
    setStatus('⏹ Stopped.', 'yellow');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled  = true;
  }
</script>
</body>
</html>
